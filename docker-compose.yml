# Chạy TOÀN BỘ EduFlaw (web + CSDL) chỉ bằng một lệnh — không cần cài Python hay MySQL:
#
#   docker compose up            # build + chạy (lần đầu vài phút), rồi mở http://localhost:8000
#   docker compose up -d         # chạy nền
#   docker compose down          # tắt (giữ dữ liệu)
#   docker compose down -v       # tắt và XÓA dữ liệu
#
# Đăng nhập Master: tài khoản  master@eduflaw.com   mật khẩu  MasterEduFlaw@123
#
# LƯU Ý: các khóa/mật khẩu dưới đây chỉ để CHẠY THỬ trên máy local. Khi triển khai thật phải đổi
# SECRET_KEY, FIELD_ENCRYPTION_KEY, MASTER_PASSWORD và không mở cổng ra Internet nếu chưa có HTTPS.
services:
  db:
    image: mysql:8.4
    container_name: eduflaw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: eduflaw
      MYSQL_DATABASE: eduflaw_db
    # Chỉ mở cho máy local (127.0.0.1) và dùng cổng 3307 để không đụng MySQL sẵn có trên 3306.
    # Web trong Docker vẫn nối CSDL qua mạng nội bộ (host "db"), không phụ thuộc cổng này.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - eduflaw_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-peduflaw"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduflaw-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Kết nối tới CSDL trong mạng nội bộ của compose (service "db")
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: eduflaw
      MYSQL_DB: eduflaw_db
      # MySQL 8 (caching_sha2_password) yêu cầu kết nối mã hóa; CSDL nội bộ dùng chứng chỉ tự ký nên
      # bật TLS nhưng KHÔNG xác thực chứng chỉ (verify=false). Đủ an toàn trong mạng docker nội bộ.
      MYSQL_SSL_VERIFY: "false"
      # Khóa bí mật CHẠY THỬ (đổi khi triển khai thật)
      SECRET_KEY: eduflaw-local-demo-secret-key-change-in-production
      FIELD_ENCRYPTION_KEY: eduflaw-local-demo-field-key-change-in-production
      # Tài khoản Master để đăng nhập ngay sau khi seed
      MASTER_USERNAME: master@eduflaw.com
      MASTER_PASSWORD: MasterEduFlaw@123
      # development: chạy qua waitress, không bắt buộc HTTPS; OTP in ra log khi chưa cấu hình SMTP
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  eduflaw_mysql_data:
