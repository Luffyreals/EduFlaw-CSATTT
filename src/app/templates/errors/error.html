<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - {{ title }} | EduFlaw</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; color: #334155; }
        .card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
                max-width: 480px; width: 100%; padding: 36px 32px; text-align: center; }
        .code { font-size: 56px; font-weight: 800; color: #701a24; letter-spacing: 2px; margin: 0; }
        h1 { font-size: 20px; color: #0f172a; margin: 8px 0 10px; }
        p { margin: 0 0 24px; line-height: 1.6; font-size: 14.5px; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; border: 1px solid #cbd5e1; color: #334155; background: white; cursor: pointer; }
        .btn-primary { background: #701a24; border-color: #701a24; color: white; }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">{{ code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Về trang chủ</a>
            <button type="button" class="btn" onclick="history.back()">Quay lại</button>
        </div>
    </main>
</body>
</html>
